<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Theo dõi Date 1016</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--navy:#0039a6;--kred:#e8082c;--bg:#f2f5fb;--ink:#16202c;--ink2:#465364;--line:#e3e7ec;--blue-soft:#e8f0fa;--kred-soft:#fde7eb;--ok:#1f8a4c;--warn:#f5b800;--bad:#d63b2f;--card-line:#e1e7f2;--orange:#c2560c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 'Be Vietnam Pro',system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{background:#fff}.hero .wrap{display:flex;align-items:flex-end;gap:24px;padding-top:20px}
.hero-main{flex:1;min-width:0;padding-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink2)}.brand img{height:46px}
.group{display:inline-block;margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--kred)}
h1{margin:6px 0 0;color:var(--navy);font-size:clamp(26px,4.2vw,40px);font-weight:800;line-height:1.15}
h1 small{display:block;font-size:.55em;font-weight:700;opacity:.85;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--blue-soft);color:var(--navy);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;border:0;font-family:inherit}
button.chip{cursor:pointer}button.chip.on{background:var(--navy);color:#fff}
.mascot-hero{width:150px;height:auto;flex:none}
.nav{position:sticky;top:0;z-index:20;background:var(--navy)}
.nav .wrap{display:flex;align-items:center;gap:6px;height:50px;overflow-x:auto;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.nav .logo-box{background:#fff;border-radius:6px;padding:4px 8px;display:flex;flex:none;margin-right:6px}.nav .logo-box img{height:20px}
.nav button{background:none;border:0;color:#fff;font:600 13px 'Be Vietnam Pro',sans-serif;white-space:nowrap;padding:7px 11px;border-radius:8px;cursor:pointer;opacity:.85;position:relative}
.nav button.on{background:#fff;color:var(--navy);opacity:1}
.nav .badge{position:absolute;top:0;right:0;background:var(--kred);color:#fff;font-size:10px;line-height:16px;min-width:16px;border-radius:8px;padding:0 4px}
.nav .user{margin-left:auto;color:#fff;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:8px;flex:none;padding-left:10px}
.nav .user button{padding:4px 8px;border:1px solid rgba(255,255,255,.5);opacity:1}
main{padding-bottom:60px}
section{padding-top:28px}
.sec-head{display:flex;align-items:center;gap:12px}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--kred);color:#fff;display:grid;place-items:center;font-weight:800}
h2{margin:0;color:var(--navy);font-size:24px;font-weight:800}
.lead{color:var(--ink2);margin:6px 0 14px}
h3{margin:0 0 8px;font-size:17px;font-weight:700}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:#fff;border:1px solid var(--card-line);border-radius:14px;box-shadow:0 1px 3px rgba(0,40,120,.05);padding:16px}
.kpi{border-top:4px solid var(--kred);cursor:default}.kpi .v{font-size:26px;font-weight:800;color:var(--navy);line-height:1.2}.kpi .d{color:var(--ink2);font-size:12.5px}
.kpi.red .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
.tbl{overflow-x:auto;border:1px solid var(--card-line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%}
th{background:var(--navy);color:#fff;font-size:13px;font-weight:600;text-align:left;padding:9px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);font-size:14px;vertical-align:top}
tbody tr:nth-child(even){background:#fafbfc}
tr.click{cursor:pointer}tr.click:hover{background:var(--blue-soft)}
.action{background:var(--blue-soft);border-left:4px solid var(--navy);border-radius:10px;padding:12px 14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:#e3f4ea;color:var(--ok)}.tag.warn{background:#fff5d6;color:#8a6500}.tag.bad{background:var(--kred-soft);color:var(--bad)}
.tag.crit{background:var(--bad);color:#fff}.tag.or{background:#ffe8d6;color:var(--orange)}.tag.blue{background:var(--blue-soft);color:var(--navy)}.tag.gray{background:#eef1f5;color:var(--ink2)}
.btn{border:2px solid var(--navy);background:var(--navy);color:#fff;font:600 14px 'Be Vietnam Pro',sans-serif;padding:7px 16px;border-radius:20px;cursor:pointer;white-space:nowrap}
.btn.sub{background:#fff;color:var(--navy)}.btn.red{background:var(--kred);border-color:var(--kred)}.btn.sm{font-size:12.5px;padding:3px 11px}
.btn:disabled{opacity:.5;cursor:default}
.tab{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font:600 13px 'Be Vietnam Pro',sans-serif;cursor:pointer;color:var(--ink)}.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
input,select,textarea{font:400 15px 'Be Vietnam Pro',sans-serif;border:1px solid #cfd7e3;border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);border-color:var(--navy)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
.more{margin-top:10px}.more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--navy)}
.pobar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;margin-top:10px}.pobar .btn{background:#fff;color:var(--navy);border-color:#fff}
.poin{width:118px;font-size:16px}.poq{width:70px}
.srcbox{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}.srcopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;font-weight:500;color:var(--ink);cursor:pointer}.srcopt input{margin-top:3px;flex:none}.srcopt:has(input:checked){border-color:var(--navy);background:var(--blue-soft)}
.drow{display:flex;gap:6px;align-items:stretch}.drow>input{flex:1;min-width:0;font-size:17px;letter-spacing:.04em}
.dpick{position:relative;flex:none;width:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:20px;cursor:pointer}.dpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.muted{color:var(--ink2);font-size:13px}
.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--ok);font-weight:600;min-height:18px}.hint.bad{color:var(--bad)}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.it .main{flex:1;min-width:0}.it .nm{font-weight:600}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.st{font-size:11.5px;font-weight:600;border-radius:8px;padding:2px 8px;background:#eef1f5;color:var(--ink2)}
.st.done{background:#e3f4ea;color:var(--ok)}.st.now{background:var(--kred);color:#fff}.st.miss{background:var(--kred-soft);color:var(--bad);text-decoration:line-through}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 10px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:760px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.modal .mh h3{color:var(--navy);margin:0;font-size:19px}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#16202c;color:#fff;padding:10px 18px;border-radius:12px;z-index:80;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:92vw}
.toast.on{opacity:1}.toast.bad{background:var(--bad)}
.syncbar{font-size:12px;color:var(--ink2);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}.dot.off{background:var(--warn)}
.login{max-width:420px;margin:40px auto}
.pbar{height:8px;border-radius:4px;background:#e8edf4;overflow:hidden;min-width:60px}.pbar i{display:block;height:100%;background:var(--ok)}
.score{font-weight:800;font-size:16px}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800}
.rank.r1{background:#f5b800;color:#16202c}
#printArea{display:none}
.lbls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lbl{border:2px solid var(--kred);border-radius:8px;padding:6px 8px;page-break-inside:avoid;font-family:'Be Vietnam Pro',Arial,sans-serif}
.lbl .pc{background:var(--kred);color:#fff;font-weight:800;font-size:20px;text-align:center;border-radius:4px}
.lbl .n{font-size:11px;font-weight:600;line-height:1.3;height:29px;overflow:hidden;margin:3px 0}
.lbl .o{text-decoration:line-through;color:#666;font-size:12px}.lbl .p{font-size:22px;font-weight:800;color:var(--kred)}
.lbl .b{font-size:10px;color:#444}
.hide-d{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}@page{size:A4;margin:8mm}}
@media(max-width:640px){.hero .wrap{flex-direction:row;align-items:flex-end;gap:0}.mascot-hero{width:90px}.brand img{height:34px}h2{font-size:21px}.kpi .v{font-size:22px}.hide-m{display:none}td,th{padding:7px 8px}.hide-d{display:inline}}
</style>
</head>

<script>
/*ENGINE-START*/
var ENGINE = (function () {
  var DAY = 86400000, TZ = 7 * 3600000;
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function today(now) { return Math.floor(((now || Date.now()) + TZ) / DAY); }
  function msDay(ms) { ms = +ms; return ms ? Math.floor((ms + TZ) / DAY) : null; }
  function dn(s) {
    if (s === '' || s == null) return null;
    if (typeof s === 'number') return s;
    var m = String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    return m ? Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / DAY) : null;
  }
  function iso(d) { var t = new Date(d * DAY); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); }
  function fmt(x) { var d = typeof x === 'number' ? x : dn(x); if (d == null) return ''; var t = new Date(d * DAY); return pad(t.getUTCDate()) + '/' + pad(t.getUTCMonth() + 1) + '/' + t.getUTCFullYear(); }
  function ym(d) { return iso(d).slice(0, 7); }

  var DEF = {
    cats: [
      { cat: '4', name: 'Sơn', mode: 'POLICY', ladder: 'NONFOOD', cycle: 30 },
      { cat: '5', name: 'Ly giấy - Màng bọc thực phẩm', mode: 'POLICY', ladder: 'NONFOOD', cycle: 30 },
      { cat: '7', name: 'Chăm sóc xe', mode: 'POLICY', ladder: 'NONFOOD', cycle: 30 },
      { cat: '9', name: 'Làm vườn', mode: 'POLICY', ladder: 'NONFOOD', cycle: 30 },
      { cat: '11', name: 'Cây xanh - Hạt giống', mode: 'POLICY', ladder: 'NONFOOD', cycle: 30 },
      { cat: '12', name: 'Thú cưng', mode: 'POLICY', ladder: 'NONFOOD', cycle: 30 },
      { cat: '15', name: 'Mỹ phẩm - CSCN', mode: 'POLICY', ladder: 'NONFOOD', cycle: 30 },
      { cat: '19', name: 'Sức khoẻ', mode: 'POLICY', ladder: 'NONFOOD', cycle: 30 },
      { cat: '25', name: 'Thực phẩm', mode: 'ALL', ladder: 'FOOD', cycle: 30 }
    ],
    grace: 2, soonDays: 14, recheckNear: 7, nearWindow: 30,
    minVN: 0.65, minNK: 0.6,
    food: { A: [60, 30, 15], B: [30, 15, 10], C: [20, 10, 7], D: [10, 5, 3] },
    foodPct: [0.2, 0.5, 0.7],
    nonfood: { mode: 'PROP', base: 36, steps: [[0.3, 10], [0.5, 6], [0.7, 3]] },
    offShelf: { A: 5, B: 4, C: 3, D: 1 },
    hoTro: { pct: 0.5, d: 180 },
    nccFollowUp: 7,
    emails: '', ccEmails: ''
  };
  function config(c) {
    var o = JSON.parse(JSON.stringify(DEF));
    if (c) for (var k in c) if (c[k] !== undefined && c[k] !== null && c[k] !== '') o[k] = c[k];
    return o;
  }
  function catCfg(cfg, cat) {
    for (var i = 0; i < cfg.cats.length; i++) if (String(cfg.cats[i].cat) === String(cat)) return cfg.cats[i];
    return null;
  }
  function slClass(sl) { return sl == null ? 'A' : sl >= 365 ? 'A' : sl >= 210 ? 'B' : sl >= 30 ? 'C' : 'D'; }
  var POLICY_NAME = { DOI_TRA: 'Được đổi/trả', KHONG_DOI_TRA: 'Không đổi trả - Store giảm giá', HO_TRO_GG: 'NCC hỗ trợ giảm giá' };

  // Lập các mốc xử lý cho 1 date: d = số ngày trước HSD
  function plan(lot, prod, ncc, cfg) {
    var cc = catCfg(cfg, lot.cat) || { ladder: 'FOOD' };
    var exp = dn(lot.exp), mfg = dn(lot.mfg);
    var sl = (mfg != null && exp > mfg) ? exp - mfg : (prod && +prod.slMonths ? Math.round(+prod.slMonths * 30.4) : null);
    var cls = slClass(sl), pol = ncc ? (ncc.policy || 'KHONG_DOI_TRA') : 'KHONG_DOI_TRA', steps = [];
    if (pol === 'DOI_TRA' || pol === 'HO_TRO_GG') {
      var nd = +ncc.notifyDays || ((+ncc.notifyPct && sl) ? Math.round(sl * +ncc.notifyPct) : 0) || (cc.ladder === 'FOOD' ? cfg.food[cls][0] : 90);
      steps.push({ k: 'BAO_NCC', d: nd, label: pol === 'DOI_TRA' ? 'Báo NCC đổi date/trả' : 'Báo NCC hỗ trợ GG' });
    }
    if (pol === 'HO_TRO_GG') steps.push({ k: 'GG2', d: cfg.hoTro.d, pct: cfg.hoTro.pct, label: 'Giảm ' + Math.round(cfg.hoTro.pct * 100) + '% (NCC hỗ trợ)' });
    if (pol === 'KHONG_DOI_TRA') {

  var CLOSE_STEPS = { DISCARD: 1, TRA_NCC: 1, DOI_DATE: 1, BAN_HET: 1 };

  function lotStatus(lot, ix, cfg, td) {

    var acts = ix.acts[lot.id] || [], at = doneMap(acts);
    var closeAt = null; for (var k in CLOSE_STEPS) if (at[k] != null && (closeAt == null || at[k] < closeAt)) closeAt = at[k];

      lot: lot, id: lot.id, barcode: lot.barcode, name: lot.name || (prod && prod.name) || '', cat: lot.cat, vendorCode: lot.vendorCode,
      vendorName: (ncc && ncc.vendorName) || (prod && prod.vendorName) || '', ncc: ncc, prod: prod, plan: p, steps: stepInfo,

  function analyze(data, cfg, now) {

    });

      .map(function (s) { s.pri = s.level === 'ok' || s.level === 'soon' ? (s.recheck || s.nccWait ? 3 : PRI[s.level]) : PRI[s.level]; return s; })
      .sort(function (a, b) { return a.pri - b.pri || a.left - b.left; });

  }

  // ---------- Chấm điểm ----------
  var W_CAT = { coverage: 35, ontime: 30, speed: 15, complete: 10, loss: 10 };
  var W_NCC = { resp: 30, speed: 20, resolve: 30, recv: 20 };
  function weighted(m, W) {

  }

  function monthRange(ymStr) {
    var y = +ymStr.slice(0, 4), m = +ymStr.slice(5, 7);
    return [Math.round(Date.UTC(y, m - 1, 1) / DAY), Math.round(Date.UTC(y, m, 1) / DAY) - 1];
  }
  function scoreMonth(data, cfg, ymStr, now, an) {

    (data.XuLy || []).forEach(function (a) { var d = msDay(a.at); if (a.step === 'KIEM' && d >= ms && d <= me) per(a.by || '?').checks++; });

    }).sort(function (a, b) { return (b.score || 0) - (a.score || 0) || (b.raw.checks + b.raw.lots) - (a.raw.checks + a.raw.lots); });

      .then(t => { try { return JSON.parse(t); } catch (e) { throw new Error('Máy chủ Apps Script chưa cập nhật Code.gs bản mới (Triển khai > Quản lý triển khai > Phiên bản mới)'); } })
      .then(j => { if (j && j.error) throw new Error(j.error); res(j); })
      .catch(e => rej(/Failed to fetch|NetworkError|Load failed/i.test(String(e && e.message)) ? new Error('Không kết nối được máy chủ - kiểm tra mạng, hoặc Apps Script chưa cập nhật Code.gs bản mới') : e));
    else setTimeout(() => { try { res(JSON.parse(LOCAL[fn](...args))); } catch (e) { rej(e); } }, 60);

}

let QUEUE = LS.get('kdate_queue', []), flushing = false, ONLINE = true;
function put(table, rows) {
  rows = [].concat(rows);
  const list = DB[table], m = new Map(list.map((r, i) => [r.id, i]));
  rows.forEach(r => { r.updatedAt = String(Date.now()); if (m.has(r.id)) list[m.get(r.id)] = Object.assign({}, list[m.get(r.id)], r); else list.push(r); });
  QUEUE.push({ table, rows }); LS.set('kdate_queue', QUEUE);
  recompute(); flush();
}
async function flush() {
  if (flushing || !QUEUE.length || !AUTH) { syncInfo(); return; }
  flushing = true; syncInfo();
  try {
    while (QUEUE.length) {
      const job = QUEUE[0];
      await srv('apiSave', AUTH, job.table, job.rows);
      QUEUE.shift(); LS.set('kdate_queue', QUEUE);
    }
    ONLINE = true;
  } catch (e) {
    ONLINE = false;
    const msg = String(e && e.message || e);
    if (/PIN|Quản lý/.test(msg)) { toast(msg, true); QUEUE.shift(); LS.set('kdate_queue', QUEUE); }
    setTimeout(flush, 30000);
  }
  flushing = false; syncInfo();
}
let LAST_LOAD = 0;
async function load(silent) {
  try {
    const d = await srv('apiLoad');
    TABLES.forEach(t => DB[t] = d[t] || []);
    QUEUE.forEach(j => { const m = new Map(DB[j.table].map((r, i) => [r.id, i])); j.rows.forEach(r => { if (m.has(r.id)) DB[j.table][m.get(r.id)] = r; else DB[j.table].push(r); }); });
    const c = DB.CauHinh.find(r => r.id === 'config');
    CFG = E.config(c ? JSON.parse(c.value) : null);
    LAST_LOAD = Date.now(); ONLINE = true;
    recompute();

}

function skuFilter(s) {
  if (!inCat(s.cat)) return false;
  if (INF === 'TODO' && !(s.state === 'CHUA_KIEM' || s.state === 'QUA_CHU_KY')) return false;
  if (INF === 'NEAR' && !(s.worst && s.worst.level !== 'ok')) return false;
  if (INF === 'GAP' && !(s.lots.length && recon(s).gap > 0)) return false;
  if (INF === 'PENDING' && s.state !== 'PENDING') return false;
  if (INF === 'OK' && s.state !== 'DA_KIEM') return false;
  if (INF !== 'PENDING' && INF !== 'ALL' && s.state === 'PENDING') return false;
  if (INQ) { const q = norm(INQ); if (!(s.barcode.includes(INQ.trim()) || norm(s.name).includes(q) || norm(s.p.vendorName).includes(q))) return false; }
  return true;
}
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase(); }
function stateTag(s) {
  if (s.state === 'PENDING') return '<span class="tag warn">Chờ phân loại</span>';
  if (s.worst && s.worst.level !== 'ok') return lvlTag(s.worst.level);
  if (s.state === 'CHUA_KIEM') return '<span class="tag bad">Chưa kiểm</span>';
  if (s.state === 'QUA_CHU_KY') return '<span class="tag or">Quá chu kỳ</span>';
  return '<span class="tag ok">Đã kiểm ' + E.fmt(s.last).slice(0, 5) + '</span>';
}
function drawSkus() {
  const all = AN.skus.filter(s => inCat(s.cat));
  const cnt = { ALL: 0, TODO: 0, GAP: 0, NEAR: 0, PENDING: 0, OK: 0 };
  all.forEach(s => { if (s.state !== 'PENDING') cnt.ALL++; if (s.state !== 'PENDING' && s.lots.length && recon(s).gap > 0) cnt.GAP++; if (s.state === 'CHUA_KIEM' || s.state === 'QUA_CHU_KY') cnt.TODO++; if (s.worst && s.worst.level !== 'ok') cnt.NEAR++; if (s.state === 'PENDING') cnt.PENDING++; if (s.state === 'DA_KIEM') cnt.OK++; });
  cnt.ALL += cnt.PENDING;
  $$('[data-n]').forEach(el => el.textContent = cnt[el.dataset.n]);
  const rank = s => s.state === 'PENDING' ? 3 : (s.worst && s.worst.level !== 'ok') ? 0 : s.state === 'CHUA_KIEM' ? 1 : s.state === 'QUA_CHU_KY' ? 2 : 4;
  const list = AN.skus.filter(skuFilter).sort((a, b) => rank(a) - rank(b) || (a.worst ? a.worst.exp : 1e9) - (b.worst ? b.worst.exp : 1e9) || a.name.localeCompare(b.name));

  drawBulk(list);
  $('#skuMore').innerHTML = list.length > INLIMIT ? `<p class="row"><span class="muted">Đang hiện ${INLIMIT}/${list.length} mã.</span><button class="btn sub sm" onclick="INLIMIT+=300;drawSkus()">Xem thêm</button></p>` : '';
}
function drawBulk(list) {
  const el = $('#bulkBar'); if (!el) return;
  if (INF !== 'PENDING' || !list.length) { el.innerHTML = ''; return; }
  const by = {}; list.forEach(s => { const k = s.cat + '|' + s.p.vendorCode; (by[k] = by[k] || { cat: s.cat, v: s.p.vendorCode, n: s.p.vendorName, items: [] }).items.push(s); });

// Đọc ngày gõ tay: 20/05/2027 · 20/5/27 · 05/2027 · 2027-05-20 · 20052027 · 200527 · 20270520
function parseDate(s, endOfMonth) {
  s = String(s || '').trim(); if (!s) return null;
  let m, y, mo, d = null;
  const Y = v => { v = +v; return v < 100 ? 2000 + v : v > 2400 ? v - 543 : v; };
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))) [y, mo, d] = [+m[1], +m[2], +m[3]];
  else if ((m = s.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{2}|\d{4})$/))) [d, mo, y] = [+m[1], +m[2], Y(m[3])];
  else if ((m = s.match(/^(\d{1,2})[-\/. ](\d{4}|\d{2})$/))) [mo, y] = [+m[1], Y(m[2])];
  else if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})$/))) [y, mo] = [+m[1], +m[2]];
  else if (/^\d{8}$/.test(s)) { if (+s.slice(0, 4) > 1990 && +s.slice(4, 6) <= 12) [y, mo, d] = [+s.slice(0, 4), +s.slice(4, 6), +s.slice(6)]; else [d, mo, y] = [+s.slice(0, 2), +s.slice(2, 4), +s.slice(4)]; }
  else if (/^\d{6}$/.test(s)) [d, mo, y] = [+s.slice(0, 2), +s.slice(2, 4), Y(s.slice(4))];
  else if (/^\d{4}$/.test(s)) [mo, y] = [+s.slice(0, 2), Y(s.slice(2))];
  else return null;
  if (!(mo >= 1 && mo <= 12) || !(y > 2000 && y < 2100)) return null;
  const dim = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  if (d == null) d = endOfMonth ? dim : 1;
  if (d < 1 || d > dim) return null;
  return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}
// Ô ngày: chỉ cần gõ số (bàn phím số), tự thêm dấu "/": 200527 -> 20/05/27 · 0527 -> 05/27 (tháng) · có nút lịch.
function dateField(id, label, endOfMonth, val) {
  return `<label class="f">${label}<span class="drow"><input id="${id}" placeholder="Gõ số, VD 200527" value="${val ? E.fmt(val) : ''}" autocomplete="off" inputmode="numeric" data-eom="${endOfMonth ? 1 : 0}"><span class="dpick" title="Chọn trên lịch">📅<input type="date" id="${id}P" tabindex="-1" aria-label="Chọn ngày trên lịch"></span></span><span class="hint" id="${id}H"></span></label>`;

function fmtDigits(d) { d = d.slice(0, 8); return d.length <= 2 ? d : d.length <= 4 ? d.slice(0, 2) + '/' + d.slice(2) : d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4); }
function readDate(v, eom) { return parseDate(v, eom) || parseDate(String(v || '').replace(/\D/g, ''), eom); }
function bindDate(id, cb) {
  const el = $('#' + id), h = $('#' + id + 'H'), pk = $('#' + id + 'P'); let manual = false;

  el.addEventListener('beforeinput', e => { if (e.data && /[^\d]/.test(e.data)) manual = true; });

}

function coverage(cats) {

  AN.skus.forEach(s => { const b = by[s.cat]; if (!b) return; if (s.state === 'PENDING') { b.pending++; return; }

}

function parseItems(aoa) {
  const out = new Map();
  let hi = -1, H = {};
  for (let r = 0; r < Math.min(aoa.length, 15); r++) {
    const h = (aoa[r] || []).map(x => norm(x).trim());
    if (h.some(x => /^barcode$|^ma vach$/.test(x))) {
      hi = r; const f = re => h.findIndex(x => re.test(x));
      H = { bc: f(/^barcode$|^ma vach$/), code: f(/^item code$|^ma hang$|^sku$/), name: f(/item name|ten hang|ten san pham|^name$/), vc: f(/supplier code|vendor code|ma ncc/), vn: f(/supplier name|vendor name|ten ncc/), price: f(/sales unit price|^price$|gia ban/), cat: f(/^cat$|^category$|^dept|^nganh/), stock: f(/close qty|^stock$|^ton|on hand/), cost: f(/cost|gia von|^mac$/) };
      break;
    }
  }
  const pos = { bc: 0, code: 2, name: 3, vc: 4, vn: 5, price: 8, cat: 9, stock: 11, cost: -1 };
  const M = hi >= 0 ? H : pos;
  for (let r = hi + 1; r < aoa.length; r++) {
    const row = aoa[r]; if (!row) continue;
    const bc = String(row[M.bc] || '').trim(); if (!/^\d{4,14}$/.test(bc)) continue;
    const g = i => i >= 0 ? String(row[i] == null ? '' : row[i]).trim() : '';
    const cat = String(parseInt(g(M.cat), 10) || g(M.cat));
    out.set(bc, { id: bc, barcode: bc, itemCode: g(M.code), name: g(M.name), cat, vendorCode: g(M.vc), vendorName: g(M.vn), price: g(M.price).replace(/[^\d.]/g, ''), cost: g(M.cost).replace(/[^\d.]/g, ''), stock: g(M.stock).replace(/[^\d.-]/g, ''), slMonths: '', flag: '', flagBy: '' });
  }
  return [...out.values()];
}

const CT_API = 'https://script.google.com/macros/s/AKfycbw_dtAap9x7uXUvQ2S8FK0fyVGxoEdDZXMY0Z0xfsoQ5vO0fld9CkttOzOV64HC6uq4oA/exec';

function idb(mode, fn) { return new Promise((ok, no) => { try { const r = indexedDB.open('kdate', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onerror = () => no(r.error);
  r.onsuccess = () => { const tx = r.result.transaction('kv', mode), st = tx.objectStore('kv'), q = fn(st); tx.oncomplete = () => ok(q && q.result); tx.onerror = () => no(tx.error); }; } catch (e) { no(e); } }); }

  if (CT.map && !force) return Promise.resolve(CT.map);

  CT.loading = (async () => {
    const c = await idbGet('ct');
    if (c && !force && Date.now() - c.t < 4 * 3600e3) { CT.map = c.d; CT.at = c.at; return CT.map; }
    try { const j = await (await fetch(CT_API + '?action=data&_=' + Date.now())).json();
      if (j && j.productData) { CT.map = j.productData; CT.at = j.updatedAt; idbSet('ct', { t: Date.now(), at: j.updatedAt, d: j.productData }); } }
    catch (e) { if (c) { CT.map = c.d; CT.at = c.at; } }

}
function ctFind(m, bc) { if (!m || !bc) return null; bc = String(bc).trim(); return m[bc] || m[bc.replace(/^0+/, '')] || m[bc.padStart(13, '0')] || m[bc.padStart(12, '0')] || m[bc.padStart(8, '0')] || null; }
const catNorm = c => String(parseInt(c, 10) || c || '').trim();
// Đoán CAT: CHECK TỒN có CAT -> chắc chắn; không có thì theo NCC (các mã cùng NCC đang ở CAT nào), rồi CAT của SUP
function guessCat(x) {
  if (x.cat !== undefined && x.cat !== null && x.cat !== '') return { cat: catNorm(x.cat), sure: true, why: 'CAT theo CHECK TỒN' };
  const mine = liCats(), cnt = {};
  DB.SanPham.forEach(p => { if (String(p.vendorCode) === String(x.suppCode) && mine.includes(p.cat)) cnt[p.cat] = (cnt[p.cat] || 0) + 1; });
  const ks = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
  if (ks.length === 1) return { cat: ks[0], sure: true, why: 'theo NCC ' + (x.suppName || x.suppCode) };
  if (ks.length) return { cat: ks[0], sure: false, why: 'NCC có hàng ở nhiều CAT' };
  const u = userCats(); if (u.length === 1) return { cat: u[0], sure: true, why: 'CAT bạn phụ trách' };

function ctProd(bc, x, cat) { return { id: bc, barcode: bc, itemCode: x.code || '', name: x.name || bc, cat, vendorCode: String(x.suppCode || ''), vendorName: x.suppName || '', price: String(x.price || ''), cost: '', stock: String(x.stock == null ? '' : x.stock), slMonths: '', flag: '', flagBy: USER.name }; }

async function scanHit(code) {

// Đọc file PO Detail: PO đã nhận (SL nhận + ngày nhận) và PO đang chờ về; chỉ giữ mã thuộc CAT theo dõi, 12 tháng gần nhất
async function poImportFile(f) {
  if (!f) return; const info = $('#poInfo'); info.textContent = 'Đang đọc file PO Detail...';
  try {
    const isCsv = /\.(csv|txt)$/i.test(f.name);
    const wb = isCsv ? XLSX.read(await f.text(), { type: 'string', raw: true }) : XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
    let H = null, hr = -1;
    for (let r = 0; r < Math.min(aoa.length, 25) && !H; r++) { const h = (aoa[r] || []).map(x => norm(x).trim()); const f2 = re => h.findIndex(x => re.test(x));
      if (f2(/^po no/) >= 0 && f2(/^barcode$/) >= 0) { hr = r; H = { po: f2(/^po no/), pd: f2(/^purchased date/), rd: f2(/^purchase record date/), eta: f2(/^estimated delivery date/), st: f2(/^status/), bc: f2(/^barcode$/), ic: f2(/^item code$/), nm: f2(/^item name$/), vc: f2(/^supplier code$/), vn: f2(/^supplier name$/), oq: f2(/^order qty$/), pq: f2(/^purchased qty$/), dq: f2(/^partial delivered qty$/), cx: f2(/^canceled datetime/) }; } }
    if (!H) throw new Error('Không thấy cột PO No. / Barcode - cần file PODetail từ POS');
    await ctLoad();
    const vset = new Set(DB.SanPham.map(p => p.vendorCode)), cut = E.iso(E.today() - 365).replace(/-/g, ''), out = new Map(); let skip = 0;
    const tracked = (bc, vc) => { if (prodOf(bc)) return true; const x = ctFind(CT.map, bc); if (x && x.cat !== undefined && x.cat !== '') return !!E.catCfg(CFG, catNorm(x.cat)); return vset.has(String(vc)); };
    for (let r = hr + 1; r < aoa.length; r++) {
      const row = aoa[r]; if (!row) continue; const g = i => i >= 0 ? String(row[i] == null ? '' : row[i]).trim() : '';
      const po = g(H.po); if (!po || g(H.cx)) continue;
      const st = norm(g(H.st)); if (/cancel/.test(st)) continue;
      let bc = g(H.bc).replace(/^'/, '').replace(/\.0+$/, ''); if (!/^\d{6,14}$/.test(bc)) { skip++; continue; }

      else if (/inspection|received|partial/.test(st)) { status = 'NHAN'; qty = oq; date = g(H.pd) || g(H.rd) || g(H.eta); }

    await srv('apiImportPO', AUTH, rows); await load(true);
    const r = poAssign(); render();
    showUpdateResult('Đã nạp PO Detail', `Nạp <b>${rows.length.toLocaleString('vi-VN')}</b> dòng PO (${rows.filter(x => x.status === 'NHAN').length.toLocaleString('vi-VN')} đã nhận, ${rows.filter(x => x.status === 'CHO').length.toLocaleString('vi-VN')} đang chờ về). Tự gán PO cho <b>${r.n}</b> date cũ (${r.skus} mã)${r.none ? `; ${r.none} date không tìm thấy PO nhận trong 12 tháng` : ''}.`);

// Gán PO cho date cũ chưa có PO: date HSD xa nhất ứng với PO nhận gần nhất, trừ dần SL từng PO
function poAssign() {

  Object.values(rec).forEach(a => a.sort((x, y) => y.date.localeCompare(x.date)));
  const open = DB.LoDate.filter(l => l.status === 'MO' && +l.qty > 0);
  open.filter(l => l.po).forEach(l => { const a = rec[l.barcode]; if (!a) return; let q = +l.qty || 0;
    String(l.po).split(/[,; ]+/).forEach(p => { const r = a.find(x => x.po === p); if (r && q > 0) { const t = Math.min(r.left, q); r.left -= t; q -= t; } }); });

function liSave() {

function liTemplate(cat) {

// ---------------- Quét mã bằng camera ----------------
let SCAN = null;
async function scan(cb) {
  modal('Quét mã vạch', `<video id="scVid" playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:60vh"></video><div id="scAlt"></div><p class="muted small">Đưa mã vạch vào giữa khung. Có súng quét: bấm vào ô tìm và quét trực tiếp.</p>`);
  const done = code => { stopScan(); closeModal(); cb(code); };
  try {
    if ('BarcodeDetector' in window) {
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'] });
      const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = $('#scVid'); v.srcObject = st; await v.play();
      SCAN = { st, t: setInterval(async () => { try { const r = await det.detect(v); if (r && r[0]) done(r[0].rawValue); } catch (e) {} }, 250) };
    } else {
      $('#scVid').style.display = 'none'; $('#scAlt').innerHTML = '<div id="scReader"></div>';
      if (!window.Html5Qrcode) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      const h = new Html5Qrcode('scReader');
      SCAN = { h };
      await h.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 140 } }, txt => done(txt));
    }
  } catch (e) { $('#scAlt').innerHTML = `<p class="hint bad">Không mở được camera (${esc(e.message || e)}). Bấm biểu tượng ổ khoá cạnh địa chỉ trang > Camera > Cho phép, rồi quét lại. Hoặc gõ mã / dùng súng quét.</p>`; }
}
function stopScan() { if (!SCAN) return; try { if (SCAN.t) clearInterval(SCAN.t); if (SCAN.st) SCAN.st.getTracks().forEach(t => t.stop()); if (SCAN.h) SCAN.h.stop().catch(() => {}); } catch (e) {} SCAN = null; }
</script>
<script>
// XW - BỘ GHI EXCEL CÓ ĐỊNH DẠNG (không cần thư viện ngoài)
const XW = (() => {
  const xmlEsc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");

  const ref = (r,c) => colName(c) + (r+1);

  // Bộ màu chuẩn Kohnan (khớp skill kohnan-page-style)

  const FONT = "Arial";

  function StyleBook() {
    const fonts = [], fills = ['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>'], borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>'], numFmts = [], xfs = [], cache = {};
    const idx = (arr, x) => { let i = arr.indexOf(x); if (i < 0) { arr.push(x); i = arr.length-1; } return i; };
    const fmtId = f => { if (!f) return 0; const builtin = {"0":1,"0.00":2,"#,##0":3,"#,##0.00":4,"0%":9,"0.0%":10,"@":49}; if (builtin[f] != null) return builtin[f]; let i = numFmts.indexOf(f); if (i < 0) { numFmts.push(f); i = numFmts.length-1; } return 164 + i; };
    const get = (o={}) => {
      const k = JSON.stringify(o); if (cache[k] != null) return cache[k];
      const f = `<font>${o.b?"<b/>":""}${o.i?"<i/>":""}<sz val="${o.sz||10}"/><color rgb="FF${o.color||C.text}"/><name val="${FONT}"/><family val="2"/></font>`;
      const fi = idx(fonts, f);
      const fl = o.fill ? idx(fills, `<fill><patternFill patternType="solid"><fgColor rgb="FF${o.fill}"/><bgColor indexed="64"/></patternFill></fill>`) : 0;
      let bd = 0;
      if (o.border) { const bc = o.border === true ? C.border : o.border; const side = t => `<${t} style="thin"><color rgb="FF${bc}"/></${t}>`; bd = idx(borders, `<border>${side("left")}${side("right")}${side("top")}${side("bottom")}<diagonal/></border>`); }
      if (o.bottom) { bd = idx(borders, `<border><left/><right/><top/><bottom style="medium"><color rgb="FF${o.bottom}"/></bottom><diagonal/></border>`); }
      const nf = fmtId(o.fmt);
      const al = `<alignment horizontal="${o.h||"general"}" vertical="${o.v||"center"}"${o.wrap?' wrapText="1"':""}${o.indent?` indent="${o.indent}"`:""}/>`;
      xfs.push(`<xf numFmtId="${nf}" fontId="${fi}" fillId="${fl}" borderId="${bd}" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">${al}</xf>`);
      return (cache[k] = xfs.length - 1);

    const xml = () => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
${numFmts.length?`<numFmts count="${numFmts.length}">${numFmts.map((f,i)=>`<numFmt numFmtId="${164+i}" formatCode="${xmlEsc(f)}"/>`).join("")}</numFmts>`:""}
<fonts count="${fonts.length}">${fonts.join("")}</fonts>
<fills count="${fills.length}">${fills.join("")}</fills>
<borders count="${borders.length}">${borders.join("")}</borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="${xfs.length}">${xfs.join("")}</cellXfs>

  const TYPE = {

  function Sheet(name) {
    const rows = [];

    const cols = sh.cols.length ? `<cols>${sh.cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols>` : "";
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheetPr>${sh.tabColor?`<tabColor rgb="FF${sh.tabColor}"/>`:""}<pageSetUpPr fitToPage="1"/></sheetPr>

<sheetViews><sheetView workbookViewId="0" showGridLines="0" zoomScale="100">${pane}</sheetView></sheetViews>

<printOptions horizontalCentered="1"/>

<pageSetup paperSize="9" orientation="${sh.landscape?"landscape":"portrait"}" fitToWidth="1" fitToHeight="0"/>
<headerFooter><oddFooter>&amp;L&amp;8KOHNAN Parc Mall - ${xmlEsc(sh.name)}&amp;R&amp;8Trang &amp;P / &amp;N</oddFooter></headerFooter>

  }

  // ZIP (lưu không nén)
  const CRC = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();

  function build(sheets, sb) {

  // API cấp cao: dựng sổ báo cáo theo mẫu Kohnan
  function Book() {

      sh.merges.push(`A1:${ref(0, nc-1)}`);
      sh.set(1, 0, "KOHNAN Parc Mall  ·  " + (opt.subtitle || ""), S.sub); for (let c=1;c<nc;c++) sh.set(1,c,"",S.sub);
      const tw = sh.cols.slice(0, nc).reduce((a,b)=>a+(b||10),0) * 1.25;
      sh.height(1, Math.max(20, Math.ceil(("KOHNAN Parc Mall  ·  " + (opt.subtitle||"")).length / tw) * 12 + 8));
      sh.merges.push(`A2:${ref(1, nc-1)}`);
      sh.r = 3;
      sh.landscape = opt.landscape !== false;
      return sh;
    }
    function section(sh, text) {
      const nc = Math.max(sh.cols.length, 2);
      sh.set(sh.r, 0, text, S.section); for (let c=1;c<nc;c++) sh.set(sh.r, c, "", S.sectionF);
      sh.height(sh.r, 22); sh.r++;
    }
    function table(sh, columns, rows, o={}) {
      const hr = sh.r, c0 = o.col0 || 0;
      columns.forEach((col, c) => sh.set(hr, c0+c, col.h, S.head));
      sh.height(hr, o.headH || 32); sh.r++;
      if (!rows.length) {
        sh.set(sh.r, c0, o.emptyText || "Không có dữ liệu", S.empty);
        for (let c=1;c<columns.length;c++) sh.set(sh.r, c0+c, "", S.empty);
        sh.merges.push(`${ref(sh.r,c0)}:${ref(sh.r,c0+columns.length-1)}`); sh.r++;
      }
      rows.forEach((row, i) => {
        const z = o.zebra !== false && i % 2 === 1;
        row.forEach((v, c) => sh.set(sh.r, c0+c, v, cellStyle(columns[c].t, z, columns[c].x)));
        let lines = 1;
        row.forEach((v, c) => { if ((columns[c].t === "wrap" || (columns[c].x && columns[c].x.wrap)) && v) { const w = (sh.cols[c0+c] || 20) * 1.15; lines = Math.max(lines, String(v).split("\n").reduce((n, seg) => n + Math.max(1, Math.ceil(seg.length / w)), 0)); } });
        if (o.rowH || lines > 1) sh.height(sh.r, Math.max(o.rowH || 18, lines * 13.5 + 5));
        sh.r++;
      });
      if (o.total) { o.total.forEach((v, c) => sh.set(sh.r, c0+c, v, totStyle(columns[c].t === "stt" ? "textB" : columns[c].t))); sh.height(sh.r, 22); sh.r++; }
      if (o.main) {
        sh.freeze = {r: hr+1, c: o.freezeCol||0};
        sh.printTitle = hr+1;
        if (rows.length) sh.filter = `${ref(hr,c0)}:${ref(hr+rows.length, c0+columns.length-1)}`;
      }
      sh.r++;
      return hr;
    }
    function kv(sh, items, o={}) {
      const per = o.pairs || 1, span = o.span || 1;
      for (let i=0; i<items.length; i+=per) {
        let rowLines = 1;
        for (let p=0; p<per; p++) {
          const it = items[i+p]; const c = p*(1+span) + (o.col0||0);
          if (!it) continue;
          sh.set(sh.r, c, it[0], S.kvL);
          sh.set(sh.r, c+1, it[1], cellStyle(it[2]||"textB", false, {b:true, wrap:true, ...(it[3]||{})}));
          const vw = sh.cols.slice(c+1, c+1+span).reduce((a,b)=>a+(b||10),0) * 1.05;
          if (typeof it[1] === "string") rowLines = Math.max(rowLines, Math.ceil(it[1].length / vw));
          for (let k=2;k<=span;k++) sh.set(sh.r, c+k, "", cellStyle("text"));
          if (span>1) sh.merges.push(`${ref(sh.r,c+1)}:${ref(sh.r,c+span)}`);
        }
        sh.height(sh.r, Math.max(20, rowLines * 13.5 + 5)); sh.r++;
      }
      sh.r++;
    }
    function note(sh, text, red) {
      const nc = Math.max(sh.cols.length, 2);
      sh.set(sh.r, 0, text, red ? S.noteB : S.note); sh.merges.push(`${ref(sh.r,0)}:${ref(sh.r,nc-1)}`);
      const w = sh.cols.slice(0, nc).reduce((a,b)=>a+(b||10),0) * 1.2;
      sh.height(sh.r, Math.max(16, Math.ceil(String(text).length / w) * 12 + 4)); sh.r++;
    }
    function save(filename) {
      const blob = build(sheets, sb);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return blob;
    }
    return { addSheet, section, table, kv, note, save, sheets, blob: () => build(sheets, sb) };
  }
  return { Book, C };
})();
</script>
<script>
// ---------------- Khởi động ----------------
$$('#nav button[data-v]').forEach(b => b.onclick = () => setView(b.dataset.v));
$('#btnLogout').onclick = () => { USER = null; AUTH = null; const s = LS.get('kdate_user', {}); LS.set('kdate_user', { name: s.name }); render(); };
(async function start() {
  $('#app').innerHTML = '<p class="muted" style="padding:30px 0">Đang tải dữ liệu...</p>';
  await load(true);
  const saved = LS.get('kdate_user', {});
  if (saved.name && saved.pin) {
    try { const r = await srv('apiLogin', saved); AUTH = saved; USER = r.user; afterLogin(); return; } catch (e) {}
  }
  render();
})();
setInterval(() => { if (USER && !$('#mbg').classList.contains('on') && document.visibilityState === 'visible') load(true).then(() => { if (!$('#mbg').classList.contains('on') && !['setup', 'recv'].includes(VIEW)) render(); }); }, 180000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && USER && Date.now() - LAST_LOAD > 60000) load(true).then(() => { if (!$('#mbg').classList.contains('on') && !['setup', 'recv'].includes(VIEW)) render(); }); });
</script>
