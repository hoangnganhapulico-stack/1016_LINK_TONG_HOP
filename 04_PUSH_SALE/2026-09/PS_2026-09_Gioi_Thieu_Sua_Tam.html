<title>ON: THE BODY — Bảng nhận diện mùi hương</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@500;600;700&family=Noto+Sans+JP:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a:#e0f2fe;
    --bg-b:#fef3c7;
    --glow-cyan:rgba(56,189,248,0.20);
    --glow-orange:rgba(245,158,11,0.15);

    --surface:rgba(255,255,255,0.92);
    --surface-border:rgba(255,255,255,0.9);
    --surface-shadow:0 20px 45px rgba(14,116,144,0.15);

    --heading:#0f172a;
    --text:#1e293b;
    --muted:#64748b;
    --muted-2:#94a3b8;

    --accent:#0284c7;
    --accent-dark:#0369a1;
    --accent-darker:#075985;
    --accent-soft:#e0f2fe;
    --accent-soft-2:#bae6fd;

    --danger:#e11d48;
    --danger-dark:#b91c1c;
    --danger-darker:#7f1d1d;

    --success:#16a34a;
    --promo:#ea580c;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --bg-a:#0b1a2b;
      --bg-b:#1c1408;
      --surface:rgba(15,23,42,0.86);
      --surface-border:rgba(56,189,248,0.18);
      --heading:#f1f5f9;
      --text:#cbd5e1;
      --muted:#94a3b8;
      --muted-2:#64748b;
      --accent:#38bdf8;
      --accent-dark:#7dd3fc;
      --accent-darker:#7dd3fc;
      --accent-soft:#0f172a;
      --accent-soft-2:#16223a;
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(420px 320px at 8% 8%, var(--glow-cyan), transparent 70%),
      radial-gradient(420px 320px at 92% 92%, var(--glow-orange), transparent 70%),
      linear-gradient(135deg, var(--bg-a), var(--bg-b));
    color:var(--text);
    font-family:'Plus Jakarta Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:26px 18px;
  }
  body.ja-active{ font-family:'Noto Sans JP','Plus Jakarta Sans',sans-serif; }
  body.zh-active{ font-family:'Noto Sans SC','Plus Jakarta Sans',sans-serif; }

  .mono{ font-family:'JetBrains Mono',monospace; }

  .sheet{
    max-width:1180px;
    margin:0 auto;
    background:var(--surface);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:2px solid var(--surface-border);
    border-radius:28px;
    box-shadow:var(--surface-shadow);
    padding:28px 34px 32px;
  }

  /* ---- toolbar (screen only) ---- */
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .lang-tabs{
    display:flex;
    gap:4px;
    background:var(--accent-soft);
    border:1px solid var(--accent-soft-2);
    border-radius:999px;
    padding:4px;
  }
  .lang-tabs button{
    appearance:none;
    border:none;
    background:transparent;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    color:var(--accent-dark);
    transition:background .15s ease,color .15s ease,box-shadow .15s ease;
  }
  .lang-tabs button.active{
    background:var(--accent);
    color:#fff;
    box-shadow:0 6px 14px rgba(2,132,199,0.35);
  }
  .print-btn{
    appearance:none;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:11px 20px;
    border-radius:999px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 10px 20px rgba(2,132,199,0.30);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .print-btn:hover{ box-shadow:0 12px 25px rgba(2,132,199,0.42); transform:translateY(-1px); }
  .print-btn svg{ width:15px; height:15px; }

  /* ---- header ---- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    flex-wrap:wrap;
    padding-bottom:16px;
    border-bottom:1.5px dashed var(--accent-soft-2);
    margin-bottom:18px;
  }
  .head-left{ min-width:240px; }
  .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:.1em;
    color:var(--accent-dark);
    text-transform:uppercase;
  }
  h1{
    font-size:28px;
    font-weight:800;
    color:var(--heading);
    margin:6px 0 6px;
    line-height:1.15;
  }
  .ja-active h1, .zh-active h1{ font-size:24px; }
  .subtitle{
    font-size:14px;
    color:var(--muted);
    font-weight:500;
  }

  .head-right{
    text-align:right;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:5px;
  }
  .price-row{
    display:flex;
    align-items:baseline;
    gap:11px;
  }
  .old-price{
    font-size:15px;
    color:var(--muted-2);
    text-decoration:line-through;
  }
  .new-price{
    font-size:38px;
    font-weight:700;
    color:var(--promo);
    letter-spacing:-.01em;
  }
  .price-unit{ font-size:14px; color:var(--muted); font-weight:500; }
  .promo-dates{
    font-size:12.5px;
    font-weight:700;
    color:#fff;
    background:var(--promo);
    padding:4px 13px;
    border-radius:999px;
  }

  /* ---- feature strip ---- */
  .features{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .feature{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:600;
    color:var(--accent-darker);
    background:var(--accent-soft);
    border:1px solid var(--accent-soft-2);
    padding:7px 14px 7px 11px;
    border-radius:999px;
  }
  .feature .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    flex:none;
  }

  /* ---- section title ---- */
  .section-title{
    text-align:center;
    font-size:16px;
    font-weight:700;
    color:var(--heading);
    margin:0 0 18px;
  }

  /* ---- cards ---- */
  .cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
  }
  .card{
    background:#fff;
    border-radius:22px;
    padding:24px 22px 24px;
    position:relative;
    border:1.5px solid var(--accent-soft-2);
    box-shadow:0 10px 24px rgba(15,23,42,0.07), 0 2px 6px rgba(15,23,42,0.05);
  }
  .card .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    margin-bottom:10px;
  }
  .card .tag{
    background:var(--accent);
    color:#fff;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.02em;
    padding:6px 13px;
    border-radius:999px;
    white-space:nowrap;
    flex:none;
  }
  .swatch-row{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .swatch{
    width:13px;height:13px;border-radius:50%;
    background:var(--accent);
    flex:none;
  }
  .swatch-label{ font-size:13px; color:var(--muted); font-weight:600; }
  .card h2{
    font-size:26px;
    font-weight:800;
    line-height:1.2;
    margin:2px 0 10px;
    color:var(--heading);
  }
  .ja-active .card h2, .zh-active .card h2{ font-size:22px; }
  .card .notes{
    font-size:15px;
    font-weight:600;
    color:var(--accent);
    line-height:1.5;
    margin-bottom:16px;
  }
  .card dl{ margin:0; }
  .card dt{
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--muted-2);
    margin-top:16px;
  }
  .ja-active .card dt, .zh-active .card dt{ letter-spacing:.02em; }
  .card dt:first-of-type{ margin-top:0; }
  .card dd{
    margin:6px 0 0;
    font-size:18px;
    font-weight:500;
    line-height:1.6;
    color:var(--text);
  }

  .card.pink{ --accent:var(--danger); --accent-dark:var(--danger-dark); --accent-darker:var(--danger-darker); }
  .card.blue{ --accent:#0284c7; --accent-dark:#0369a1; --accent-darker:#075985; }
  .card.green{ --accent:var(--success); --accent-dark:#15803d; --accent-darker:#14532d; }

  @media (max-width:860px){
    .sheet{ padding:22px 20px 24px; }
    .cards{ grid-template-columns:1fr; }
    header{ flex-direction:column; align-items:flex-start; }
    .head-right{ align-items:flex-start; text-align:left; }
    .toolbar{ flex-direction:column; align-items:stretch; }
  }

  @media print{
    html, body{ height:100%; }
    body{
      padding:0;
      background:linear-gradient(135deg, var(--bg-a), var(--bg-b)) !important;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .toolbar{ display:none; }

    /* Fix: backdrop-filter (glass blur) leaves faint ghost rectangles behind some
       cards when printed by Chromium's print engine. Printed paper gets no benefit
       from the blur anyway, so we switch to a plain opaque panel for print. */
    .sheet{
      backdrop-filter:none !important;
      -webkit-backdrop-filter:none !important;
      background:#ffffff !important;
      box-shadow:none !important;
      border-radius:16px;
      padding:14px 20px 16px;
      max-width:100%;
    }
    .card{
      box-shadow:none !important;
    }

    header{
      flex-direction:row !important;
      align-items:flex-end !important;
      margin-bottom:12px;
      padding-bottom:10px;
      gap:14px;
    }
    .head-right{ align-items:flex-end !important; text-align:right !important; }
    h1{ font-size:19px; margin:4px 0 4px; }
    .ja-active h1, .zh-active h1{ font-size:17px; }
    .eyebrow{ font-size:10.5px; }
    .subtitle{ font-size:12px; }
    .new-price{ font-size:29px; }
    .old-price{ font-size:12.5px; }
    .price-unit{ font-size:12px; }
    .promo-dates{ font-size:11px; padding:3px 10px; }
    .features{ margin-bottom:14px; gap:8px; }
    .feature{ font-size:11px; padding:5px 11px 5px 9px; }
    .feature .dot{ width:5px; height:5px; }
    .section-title{ font-size:13.5px; margin-bottom:12px; }
    .cards{
      grid-template-columns:repeat(3,1fr) !important;
      gap:12px;
    }
    .card{ padding:16px 15px 17px; border-radius:16px; }
    .card .top-row{ margin-bottom:8px; }
    .card .tag{ font-size:10px; padding:4px 10px; }
    .swatch-row{ margin-bottom:8px; }
    .swatch-label{ font-size:11.5px; }
    .card h2{ font-size:21px; margin-bottom:7px; }
    .ja-active .card h2, .zh-active .card h2{ font-size:18px; }
    .card .notes{ font-size:13px; margin-bottom:11px; line-height:1.4; }
    .card dt{ font-size:10.5px; margin-top:11px; }
    .card dd{ font-size:16px; line-height:1.5; margin-top:4px; }
    @page{ size:A5 landscape; margin:6mm; }
  }
</style>
</head>

function escapeHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function render(lang){
  const c = CONTENT[lang];

  document.documentElement.lang = lang;
  document.body.classList.remove('ja-active','zh-active');
  if(lang === 'ja') document.body.classList.add('ja-active');
  if(lang === 'zh') document.body.classList.add('zh-active');

  document.getElementById('printLabel').textContent = c.printLabel;
  document.getElementById('eyebrow').textContent = c.eyebrow;
  document.getElementById('mainTitle').textContent = c.title;
  document.getElementById('subtitle').textContent = c.subtitle;
  document.getElementById('priceUnit').textContent = c.priceUnit;
  document.getElementById('promoDates').textContent = c.promoDates;
  document.getElementById('sectionTitle').textContent = c.sectionTitle;

  document.getElementById('features').innerHTML = c.features.map(f =>
    `<span class="feature"><span class="dot"></span>${escapeHtml(f)}</span>`
  ).join('');

  document.getElementById('cards').innerHTML = c.cards.map(card => `
    <div class="card ${card.cls}">
      <div class="top-row">
        <div class="swatch-row"><span class="swatch"></span><span class="swatch-label">${escapeHtml(card.colorLabel)}</span></div>
        <span class="tag">${escapeHtml(card.tag)}</span>
      </div>
      <h2>${escapeHtml(card.name)}</h2>
      <div class="notes">${escapeHtml(card.notes)}</div>
      <dl>
        <dt>${escapeHtml(card.styleLabel)}</dt>
        <dd>${escapeHtml(card.style)}</dd>
        <dt>${escapeHtml(card.benefitLabel)}</dt>
        <dd>${escapeHtml(card.benefit)}</dd>
      </dl>
    </div>
  `).join('');
}

const tabs = document.querySelectorAll('#langTabs button');
tabs.forEach(btn => {
  btn.addEventListener('click', () => {
    tabs.forEach(b => b.classList.toggle('active', b === btn));
    render(btn.getAttribute('data-set'));
  });
});

render('vi');
</script>

</body>
</html>
