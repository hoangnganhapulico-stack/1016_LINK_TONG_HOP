  .lang-tabs button{
    appearance:none; border:none; background:transparent;
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:13px;
    padding:8px 16px; border-radius:999px; cursor:pointer; color:var(--accent-dark);

  }
  .lang-tabs button.active{ background:var(--accent); color:#fff; box-shadow:0 6px 14px rgba(219,39,119,0.35); }
  .print-btn{
    appearance:none; border:none; background:var(--accent); color:#fff;
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:13px;
    padding:11px 20px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:8px;

  .print-btn:hover{ box-shadow:0 12px 25px rgba(219,39,119,0.42); transform:translateY(-1px); }
  .print-btn svg{ width:15px; height:15px; }

  /* ---- header ---- */
  header{

  }

  .eyebrow{ font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--accent-dark); text-transform:uppercase; }
  h1{ font-size:30px; font-weight:800; color:var(--heading); margin:6px 0 6px; line-height:1.15; }
  .ja-active h1, .zh-active h1, .ko-active h1{ font-size:26px; }
  .subtitle{ font-size:14px; color:var(--muted); font-weight:500; }
  .head-right{ display:flex; flex-direction:column; align-items:flex-end; gap:7px; text-align:right; }
  .promo-dates{ font-size:13px; font-weight:700; color:#fff; background:var(--promo); padding:6px 15px; border-radius:999px; white-space:nowrap; }
  .gift-note{ font-size:12.5px; font-weight:700; color:var(--accent-dark); }

  /* ---- features ---- */
  .features{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .feature{
    display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--accent-dark);
    background:var(--accent-soft); border:1px solid var(--accent-soft-2); padding:7px 14px 7px 11px; border-radius:999px;
  }
  .feature .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none; }

  .section-title{ text-align:center; font-size:16px; font-weight:700; color:var(--heading); margin:0 0 16px; }

  /* ---- cards ---- */
  .cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .card{
    --c:#db2777; --c-soft:#fdf2f8; --c-line:#fbcfe8;
    background:#fff; color:#1e293b;
    border-radius:22px; padding:20px 20px 18px;
    border:1.5px solid var(--c-line);
    box-shadow:0 10px 24px rgba(15,23,42,0.07), 0 2px 6px rgba(15,23,42,0.05);
    display:flex; flex-direction:column;
  }
  .card.pink { --c:#db2777; --c-soft:#fdf2f8; --c-line:#fbcfe8; }
  .card.blue { --c:#0284c7; --c-soft:#f0f9ff; --c-line:#bae6fd; }
  .card.green{ --c:#16a34a; --c-soft:#f0fdf4; --c-line:#bbf7d0; }

  .top-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
  .swatch-row{ display:flex; align-items:center; gap:7px; min-width:0; }
  .swatch{ width:12px; height:12px; border-radius:50%; background:var(--c); flex:none; }
  .swatch-label{ font-size:12.5px; color:#64748b; font-weight:600; }
  .tag{ background:var(--c); color:#fff; font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:999px; white-space:nowrap; flex:none; }

  .brand{ font-size:13px; font-weight:600; color:var(--c); margin-bottom:10px; }

  .price-box .new{ font-size:30px; font-weight:700; color:var(--promo); letter-spacing:-.01em; line-height:1.1; }
  .price-box .unit{ font-size:13px; color:#64748b; font-weight:500; }
  .price-box .date{ flex-basis:100%; font-size:11.5px; font-weight:700; color:var(--c); }

  .variant span{ display:block; font-size:13.5px; color:#475569; line-height:1.4; }

  .card li{ position:relative; padding-left:16px; font-size:15px; line-height:1.45; margin-bottom:5px; color:#1e293b; }
  .card li::before{ content:""; position:absolute; left:2px; top:8px; width:6px; height:6px; border-radius:50%; background:var(--c); }

  .fit p{ margin:0; font-size:14px; line-height:1.45; color:#334155; font-weight:500; }

    .eyebrow{ font-size:8.5px; }

    .feature .dot{ width:4px; height:4px; }
    .section-title{ display:none; }

    .card{ padding:8px 10px 8px; border-radius:11px; }
    .top-row{ margin-bottom:4px; }
    .swatch{ width:8px; height:8px; }
    .swatch-label{ font-size:8.5px; }
    .tag{ font-size:8px; padding:2px 7px; }

    .brand{ font-size:8.5px; margin-bottom:4px; }
    .price-box{ padding:3px 8px; border-radius:8px; margin-bottom:3px; gap:6px; }
    .price-box .old{ font-size:9px; }
    .price-box .new{ font-size:17px; }
    .price-box .unit{ font-size:8.5px; }
    .price-box .date{ font-size:8px; }
    .lbl{ font-size:7.5px; margin:4px 0 2px; }
    .variant{ gap:5px; margin-bottom:2px; }
    .variant .vdot{ width:7px; height:7px; margin-top:3px; }
    .variant b{ font-size:9.5px; line-height:1.3; }
    .variant span{ font-size:8.5px; line-height:1.3; }
    .card li{ font-size:9.5px; line-height:1.3; margin-bottom:1.5px; padding-left:10px; }
    .card li::before{ width:4px; height:4px; top:5px; left:1px; }
    .fit{ padding-top:3px; }
    .fit p{ font-size:9px; line-height:1.3; }

    .combos{ margin-top:6px; padding:5px 8px; border-radius:10px; }
    .combos-title{ font-size:8.5px; margin-bottom:4px; }
    .combo-list{ grid-template-columns:repeat(3,1fr) !important; gap:5px; }
    .combo{ padding:3px 8px; border-radius:7px; gap:6px; }
    .combo .ctext{ font-size:8.5px; line-height:1.25; }
    .combo .cprice{ font-size:11px; }
  }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render(lang){
  const c = CONTENT[lang];
  document.documentElement.lang = lang;
  document.body.classList.remove('ja-active','zh-active','ko-active');
  if(lang === 'ja') document.body.classList.add('ja-active');
  if(lang === 'zh') document.body.classList.add('zh-active');
  if(lang === 'ko') document.body.classList.add('ko-active');

  document.getElementById('printLabel').textContent = c.printLabel;
  document.getElementById('eyebrow').textContent = c.eyebrow;
  document.getElementById('mainTitle').textContent = c.title;
  document.getElementById('subtitle').textContent = c.subtitle;
  document.getElementById('promoDates').textContent = c.promoDates;
  document.getElementById('giftNote').textContent = c.giftNote;
  document.getElementById('sectionTitle').textContent = c.sectionTitle;
  document.getElementById('combosTitle').textContent = c.combosTitle;

  document.getElementById('features').innerHTML = c.features.map(f =>
    `<span class="feature"><span class="dot"></span>${esc(f)}</span>`).join('');

  document.getElementById('cards').innerHTML = c.cards.map(card => {
    const p = PRICES[card.key];
    const variants = card.variants ? `
      <div class="lbl">${esc(c.lblVariants)}</div>
      ${card.variants.map(v => `
        <div class="variant">
          <span class="vdot" style="background:${v.color}"></span>
          <div><b>${esc(v.name)}</b><span>${esc(v.desc)}</span></div>
        </div>`).join('')}` : '';
    return `
    <div class="card ${card.cls}">
      <div class="top-row">
        <div class="swatch-row"><span class="swatch"></span><span class="swatch-label">${esc(card.label)}</span></div>
        <span class="tag">${esc(card.tag)}</span>
      </div>
      <h2>${esc(card.name)}</h2>
      <div class="brand">${esc(card.brand)}</div>
      <div class="price-box">
        ${p.old ? `<span class="old mono">${p.old}</span>` : ''}
        <span class="new mono">${p.now}</span>
        <span class="unit">${esc(card.unit)}</span>
        ${card.date ? `<span class="date">${esc(card.date)}</span>` : ''}
      </div>
      ${variants}
      <div class="lbl">${esc(c.lblPoints)}</div>
      <ul>${card.points.map(pt => `<li>${esc(pt)}</li>`).join('')}</ul>
      <div class="fit">
        <div class="lbl">${esc(c.lblFit)}</div>
        <p>${esc(card.fit)}</p>
      </div>
    </div>`;
  }).join('');

  document.getElementById('combos').innerHTML = c.combos.map((t, i) => `
    <div class="combo"><span class="ctext">${esc(t)}</span><span class="cprice mono">${COMBO_PRICES[i]}</span></div>`).join('');
}

const tabs = document.querySelectorAll('#langTabs button');
tabs.forEach(btn => btn.addEventListener('click', () => {
  tabs.forEach(b => b.classList.toggle('active', b === btn));
  render(btn.getAttribute('data-set'));
}));

render('vi');
</script>
